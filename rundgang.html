<style>
:root {
  --tinte: #3a3a3a; --ph-braun: #8a6a3a; --ph-braun-dunkel: #6e532c; --ph-sand: #f5eddf; --grau: #f4f4f4; --linie: #e3e3e3; --leise: #6b6b6b; --hell: #ffffff;
  --offen: #fce9d9; --uebernommen: #e3eef8; --gebucht: #d9e6f5; --besucht: #e6f2e6; --nichtnoetig: #f4f4f4;
  --achtung: #a33a2e; --achtung-hell: #fbe9e6; --akzent: #2f5f8a;
  --hand: "Patrick Hand", "Segoe Print", "Bradley Hand", cursive;
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 -apple-system, "Segoe UI", Arial, sans-serif; color: var(--tinte); background: #fafafa; }
header { background: var(--ph-braun); color: #fff; position: sticky; top: 0; z-index: 5; }
.kopf1 { display: flex; gap: 18px; align-items: center; padding: 8px 20px; }
header h1, h2, h3 { font-family: var(--hand); letter-spacing: .2px; font-weight: 400; }
header h1 { font-size: 24px !important; }
h2 { font-size: 28px !important; } h3 { font-size: 21px !important; }
header h1 { font-size: 19px; margin: 0 12px 0 0; font-weight: 600; }
/* Reiter wie Registerkarten: die aktive geht nahtlos in die Seite über */
nav { display: flex; gap: 2px; flex-wrap: wrap; background: #e9dcc6; padding: 6px 20px 0; }
nav button { background: transparent; color: #5a4325; border: 0; padding: 8px 14px; border-radius: 8px 8px 0 0; font-size: 15px; cursor: pointer; }
nav button:hover { background: rgba(255,255,255,.45); }
nav button.aktiv { background: #fafafa; color: var(--tinte); font-weight: 600; }
nav button.neben { color: var(--ph-braun); font-size: 14px; }
nav button[data-ansicht=aktualisieren] { margin-left: auto; }
.ichchip { display: flex; align-items: center; gap: 5px; background: #fff; color: #5a4325; border-radius: 4px; padding: 2px 4px 2px 8px; font-weight: 600; cursor: pointer; }
.ichchip select { border: 0; background: transparent; font-weight: 600; color: #5a4325; }
.kopf-ic { background: transparent; border: 1px solid rgba(255,255,255,.5); color: #fff; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 14px; }
.kopf-ic:hover { background: var(--ph-braun-dunkel); }
header .rechts { margin-left: auto; display: flex; gap: 10px; align-items: center; font-size: 14px; color: #f3ead9; }
header select { font-size: 14px; padding: 4px; }
main { padding: 18px 20px 60px; max-width: 1500px; }
h2 { font-size: 22px; margin: 4px 0 14px; font-weight: 600; }
h3 { font-size: 17px; margin: 22px 0 8px; }
.leise { color: var(--leise); }
.klein { font-size: 13px; }
button.knopf { font-size: 14px; padding: 6px 12px; border-radius: 6px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
button.knopf:hover { background: var(--grau); }
.kontakte { margin-top: 3px; white-space: normal; max-width: 420px; }
.kontakte summary { cursor: pointer; color: var(--ph-braun-dunkel); }
.kontakte > div, .kontakte details > div { margin: 2px 0 2px 12px; }
.kontakte details summary { margin-left: 12px; }
a.bericht { text-decoration: none; margin-left: 3px; }
.ber-knoepfe { display: inline-flex; gap: 2px; padding: 2px; border: 1px dashed #cfc3ad; border-radius: 6px; }
a.bericht:hover { text-decoration: underline; }
.einrichten { max-width: 720px; }
.korr-form { display: grid; gap: 8px; } .korr-form label { display: grid; gap: 3px; font-size: 13.5px; }
.sk-reihe { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 14px; }
.sk { border-radius: 12px; padding: 14px 16px 16px; cursor: pointer; border: 1px solid transparent; border-top: 6px solid var(--f); background: var(--h); color: var(--tinte); transition: transform .12s, box-shadow .12s; }
.sk:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.sk h3 { margin: 0 0 6px; color: var(--d); font-family: var(--hand); font-weight: 400; font-size: 24px; }
.sk .z { font-size: 38px; font-weight: 700; color: var(--d); line-height: 1.1; }
.sk .z-von { font-size: 20px; font-weight: 600; opacity: .7; }
.sk .klein { color: #555; }
.sk-balken { height: 8px; border-radius: 4px; background: rgba(0,0,0,.08); margin: 8px 0 6px; overflow: hidden; }
.sk-balken > div { height: 100%; background: var(--f); border-radius: 4px; }
.sk-halbtag { --f: #4f8fcf; --h: #eaf3fc; --d: #163a5c; }
.sk-profil { --f: #d9a823; --h: #fdf5dc; --d: #5a430a; }
.sk-quartal { --f: #5aa64e; --h: #ecf7e9; --d: #1c4a17; }
.sk-ziel { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk-einzel { --f: #7f77dd; --h: #eeedfe; --d: #3c3489; }
.sk-gruppe { font-size: 13px; color: #6b6b6b; margin: 4px 0 6px; letter-spacing: .02em; }
/* Startseite: links die Praktika (3 gleich breite Spalten, Rest bleibt leer), rechts Meine Termine, Studierende, Aktualisieren */
.start-raster { display: grid; grid-template-columns: minmax(0, 3fr) minmax(250px, 1fr); grid-template-rows: repeat(5, auto); column-gap: 26px; }
.start-links, .start-rechts { grid-row: 1 / span 5; display: grid; grid-template-rows: subgrid; }
.sk-reihe.drei { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.start-rechts { border-left: 2px solid #e2ded5; padding-left: 24px; }
.start-rechts > .sk { margin-bottom: 14px; }
.mt-naechst { margin-top: 8px; background: #fff; border-left: 4px solid var(--f); padding: 6px 10px; font-size: 15px; }
.mt-naechst .klein { display: block; color: var(--d); opacity: .8; }
.mt-zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; } .mt-zwei > div + div { border-left: 1px solid #dcd8cf; padding-left: 10px; }
@media (max-width: 1050px) { .start-raster { grid-template-columns: 1fr; grid-template-rows: none; }
  .start-links, .start-rechts { grid-row: auto; display: block; } .start-rechts { border-left: 0; padding-left: 0; } .start-rechts .leer-gruppe { display: none; } }
@media (max-width: 700px) { .sk-reihe.drei { grid-template-columns: 1fr; } }
/* Praktikumsfarben: Halbtag blau (A hell … D dunkel), Einzel violett, Profil gelb, Quartal grün, Spezial rot */
.fk-halbtag, .fk-ht-c { --fc: #4f8fcf; --fh: #d4e5f6; --fd: #163a5c; --fa: #fff; }
.fk-ht-a { --fc: #9cc3ec; --fh: #eef5fd; --fd: #163a5c; --fa: #163a5c; }
.fk-ht-b { --fc: #73a9e0; --fh: #e1edfa; --fd: #163a5c; --fa: #163a5c; }
.fk-ht-d { --fc: #2b5f97; --fh: #c4d9f0; --fd: #0f2b47; --fa: #fff; }
.fk-einzel { --fc: #7f77dd; --fh: #eeedfe; --fd: #3c3489; --fa: #fff; }
.fk-profil { --fc: #d9a823; --fh: #fdf5dc; --fd: #5a430a; --fa: #3d2d05; }
.fk-quartal { --fc: #5aa64e; --fh: #ecf7e9; --fd: #1c4a17; --fa: #fff; }
.fk-spezial { --fc: #c8566e; --fh: #fcedf0; --fd: #5e1a29; --fa: #fff; }
.fchip[class*="fk-"] { border: 1.5px solid var(--fc); color: var(--fd); }
.fchip[class*="fk-"].an { background: var(--fc); border-color: var(--fc); color: var(--fa); }
.pk { display: inline-block; min-width: 78px; box-sizing: border-box; text-align: center; padding: 1px 7px; border-radius: 4px; font-size: 13px; background: var(--fh); color: var(--fd); border: 1px solid var(--fc); white-space: nowrap; }
tr[class*="fk-"] > td:first-child { box-shadow: inset 5px 0 0 var(--fc); padding-left: 14px; }
.sk-perioden { margin-top: 8px; border-top: 1px solid rgba(0,0,0,.08); padding-top: 6px; display: grid; gap: 3px; }
.sk-per { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; font-size: 13px; border-radius: 4px; padding: 1px 4px; }
.sk-per:hover { background: rgba(0,0,0,.05); } .sk-per .leise { grid-column: 2 / 4; }
.sk-mini .sk-balken { margin: 0; height: 6px; }
.sk-spezial { --f: #c8566e; --h: #fcedf0; --d: #5e1a29; }
.sk-termine { --f: var(--ph-braun); --h: var(--ph-sand); --d: var(--ph-braun-dunkel); }
.sk-studierende { --f: #8a857c; --h: #f6f5f2; --d: #2e2b27; }
.sk-grau { --f: #9a9a9a; --h: #f5f5f3; --d: #3a3a3a; }
.sk table td { padding: 2px 4px; }
.akt-reiter { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 2px solid var(--ph-braun); margin: 12px 0 16px; }
.akt-reiter button { font: inherit; font-size: 14px; background: #fff; color: var(--leise); border: 1px solid var(--linie); border-bottom: 0; border-radius: 4px 4px 0 0; padding: 6px 12px; cursor: pointer; }
.akt-reiter button:hover { color: var(--tinte); }
.akt-reiter button.an { background: var(--ph-braun); color: #fff; border-color: var(--ph-braun); font-weight: 600; }
.akt-wann { background: var(--ph-sand); border-left: 4px solid var(--ph-braun); padding: 8px 12px; margin: 0 0 12px; font-size: 14px; }
.akt-raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; max-width: 1100px; }
.akt-k { background: #fff; border: 1px solid var(--linie); border-radius: 6px; padding: 12px 14px; }
.akt-k > b { color: var(--ph-braun-dunkel); font-size: 15px; display: block; margin-bottom: 4px; }
.akt-z { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
.akt-z:last-child { border-bottom: 0; }
.akt-z .ok { color: #2f7a3a; } .akt-z .off { color: var(--achtung); } .akt-z .le { color: #8a8a8a; }
.akt-inhalt > .karte { margin-bottom: 14px; }
.abschn { background: #fff; border: 1px solid var(--ph-braun-dunkel); border-radius: 6px; margin: 0 0 12px; max-width: 1100px; overflow: hidden; }
.abschn > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--ph-braun-dunkel); color: #fff; padding: 9px 14px; font-size: 15px; }
.abschn > summary::-webkit-details-marker { display: none; }
.abschn > summary::before { content: "▸"; display: inline-block; width: 12px; transition: transform .15s; }
.abschn[open] > summary::before { transform: rotate(90deg); }
.abschn > summary:hover { background: #5c4524; }
.abschn-t { font-weight: 600; }
.abschn-s { margin-left: auto; font-size: 13px; color: #f1e6d2; }
.abschn-s .ok { color: #c9ecc9; } .abschn-s .off { color: #ffd2c2; font-weight: 600; } .abschn-s .le { color: #e0d4bf; }
.abschn-i { padding: 12px 14px; }
.abschn[data-k^="zt"] { max-width: none; }
.abschn-i > .akt-wann:first-child { margin-top: 0; }
.abschn-kopf { background: var(--ph-braun-dunkel); color: #fff; font-weight: 600; font-size: 15px; padding: 9px 14px; border-radius: 6px 6px 0 0; max-width: 1100px; box-sizing: border-box; }
.abschn-kopf + .akt-raster { border: 1px solid var(--ph-braun-dunkel); border-top: 0; border-radius: 0 0 6px 6px; padding: 12px; background: var(--grau); box-sizing: border-box; }
.akt-schritte { display: grid; gap: 10px; margin: 10px 0; }
.akt-schritt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; border: 1px solid var(--linie); border-radius: 6px; padding: 10px 12px; }
.akt-schritt .nr { width: 26px; height: 26px; border-radius: 4px; background: var(--ph-braun); color: #fff; display: grid; place-items: center; font-weight: 700; }
.akt-schritt.fertig { background: #f6faf5; } .akt-schritt.fertig .nr { background: #2f7a3a; }
.lz-ziehen { cursor: grab; display: inline-block; background: #fff; color: var(--ph-braun-dunkel) !important; border: 1px dashed var(--ph-braun-dunkel); border-radius: 4px; padding: 2px 10px; font-weight: 600; text-decoration: none; }
.akt-inhalt > .akt-wann, .akt-inhalt > .einr-hinweis { max-width: 1100px; box-sizing: border-box; }
.akt-weitere { border-top: 1px dashed var(--linie); padding-top: 8px; display: grid; gap: 4px; color: var(--leise); }
.akt-team td.zahl, .akt-team th.zahl { text-align: right; }
.akt-team { max-width: 800px; } .akt-team tr.neu td { background: var(--ph-sand); }
.akt-liste { margin: 8px 0; padding-left: 18px; }
.rundgang-kasten { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; background: var(--ph-sand); border: 2px solid var(--ph-braun); border-radius: 8px; padding: 14px 18px; margin: 4px 0 18px; }
.rundgang-kasten .rk-ic { color: var(--ph-braun); flex: none; }
.rundgang-kasten .rk-t { font-family: var(--hand); font-size: 24px; color: var(--ph-braun-dunkel); }
.rundgang-kasten .rk-text { flex: 1; min-width: 240px; }
.knopf .k-ic { vertical-align: -3px; margin-right: 6px; }
/* Startseite auf dem Holztisch (Rike, 6.11.): Gruppen-Überschriften als Zettel aus Karopapier, Kacheln als Notizzettel. Nur die Startseite. */
body.holz { background: linear-gradient(rgba(70, 45, 20, .10), rgba(70, 45, 20, .10)), url(bilder/tisch.jpg) center / cover fixed, #b98d5a; }
body.holz .sk-gruppe { display: inline-block; justify-self: start; background-color: #fffdf6; background-image: linear-gradient(#cfdeea 1px, transparent 1px), linear-gradient(90deg, #cfdeea 1px, transparent 1px); background-size: 11px 11px;
  color: #2f3e4c; font-family: var(--hand); font-size: 21px; letter-spacing: 0; padding: 3px 16px 5px; margin: 6px 0 14px; box-shadow: 0 3px 7px rgba(60, 40, 10, .3); transform: rotate(-1.2deg); }
body.holz .sk-reihe > .sk:nth-child(2n) + .sk-gruppe, body.holz .start-rechts .sk-gruppe { transform: rotate(1deg); }
body.holz .sk { border-radius: 2px; border: 0; border-top: 6px solid var(--f); box-shadow: 0 4px 10px rgba(50, 30, 10, .28), 0 1px 2px rgba(50, 30, 10, .2); transform: rotate(-.5deg); }
body.holz .sk-reihe > .sk:nth-child(2n), body.holz .start-rechts > .sk:nth-of-type(2n) { transform: rotate(.6deg); }
body.holz .sk-reihe > .sk:nth-child(3n) { transform: rotate(-.2deg); }
body.holz .sk:hover { transform: rotate(0) translateY(-3px); box-shadow: 0 10px 22px rgba(50, 30, 10, .35); }
body.holz .start-rechts { border-left: 0; padding-left: 0; }
body.holz .sk-gruppe.leer-gruppe { visibility: hidden; }
/* Tisch: Rand links = Rand rechts, in der Mitte deutlich mehr Abstand zwischen den beiden Bereichen */
body.holz main { max-width: none; margin: 0; padding-left: max(20px, 3vw); padding-right: max(20px, 3vw); }
body.holz .sk-reihe.drei { grid-template-columns: repeat(2, minmax(0, 1fr)); }
body.holz .start-raster { grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); column-gap: max(40px, 8vw); }
body.holz .start-kopf h2 { display: inline-block; background: #fffdf6; color: #2f3e4c; padding: 2px 16px 4px; box-shadow: 0 3px 7px rgba(60, 40, 10, .3); transform: rotate(-.8deg); }
body.holz .rundgang-kasten { background: #fffdf8; border: 0; border-radius: 2px; box-shadow: 0 4px 12px rgba(50, 30, 10, .3); }
body.holz main > .karte, body.holz #app > .karte { box-shadow: 0 4px 12px rgba(50, 30, 10, .3); }
.start-kopf { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
details.akk > summary { cursor: pointer; list-style: none; }
details.akk > summary::-webkit-details-marker { display: none; }
details.akk > summary h3, details.akk > summary b { display: inline; margin: 0; }

details.akk[open] > summary::before { content: "▾ "; }
details.akk[open] > summary { margin-bottom: 8px; }
details.akk { padding-top: 10px; padding-bottom: 10px; }
.einr-schritt { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--linie); }
.einr-n { width: 28px; height: 28px; border-radius: 50%; background: var(--ph-braun); color: #fff; display: grid; place-items: center; font-weight: 700; }
.einr-hinweis { background: var(--ph-sand); border-left: 4px solid var(--ph-braun); padding: 10px 12px; border-radius: 6px; margin: 12px 0; }
button.knopf.gross { font-size: 16px; padding: 8px 18px; }
.akt { display: flex; gap: 4px; align-items: center; }
.akt-rechts { margin-left: auto; padding-left: 4px; }
button.knopf.haupt { background: var(--ph-braun); color: #fff; border-color: var(--ph-braun); }
button.knopf.haupt:hover { background: var(--ph-braun-dunkel); }
h2, h3 { color: var(--ph-braun-dunkel); }
.kachel.gruppe { background: var(--ph-sand); }
button.knopf.klein { font-size: 13px; padding: 3px 8px; }
.kacheln { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; }
.kachel { background: #fff; border: 1px solid var(--linie); border-radius: 8px; padding: 8px 14px; min-width: 110px; }
.kachel .t { font-size: 12px; color: var(--leise); }
.kachel .z { font-size: 24px; font-weight: 700; }
.kachel.gruppe { background: var(--grau); border: 0; display: flex; gap: 10px; padding: 8px; }
.kachel.gruppe > .kachel { min-width: 90px; }

.rot { color: var(--achtung); } .gruen { color: #3c7a3c; }
.mitfilter { display: block; }
.inhalt { min-width: 0; overflow-x: auto; }
.filterbox { background: #fff; border: 1px solid var(--linie); border-radius: 8px; margin-bottom: 10px; }
.fkopf { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; background: var(--ph-sand); border-radius: 8px; cursor: pointer; list-style: none; }
.fkopf::-webkit-details-marker { display: none; }
.fkopf b::before { content: "▸ "; } details.filterbox[open] > .fkopf b::before { content: "▾ "; }

.fgitter { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.fsek { padding: 6px 12px 10px; border-right: 1px solid var(--linie); }
.fsek:last-child { border-right: 0; }
.fblock { padding: 7px 0; border-top: 1px dashed #e2d9c8; }
.fsek > .fblock:first-of-type, .fsek > summary + .fblock { border-top: 0; }

.fsek .ftitel { display: block; font-size: 12.5px; margin: 0 0 3px; }

.fsek input[type=date] { width: 128px; }
.fsek input[type=search], .fsek input[list] { width: 100%; }
.aktivleiste { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--linie); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
.nb { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
dialog.breit { width: min(1100px, 96vw); max-width: 96vw; }
.nb-spalte h4 { margin: 0 0 6px; } .nb-tag { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
.nb-dat { width: 72px; font-size: 12.5px; color: #6b665e; } .nb .rz { width: auto; min-width: 86px; }
.knopf.mini { font-size: 11px; padding: 0 5px; line-height: 1.4; color: #9a958c; border-color: #ddd8cf; background: #fff; vertical-align: 1px; }

function km(a, b) {

/* ---------- Lade-Modus: für Rechner, auf denen die ICT «Ordner wählen» sperrt ----------

function ordnerLaden() {

    if ((/Mentorat/i.test(z) || fremd) && !(p.besuche || []).some((b) => /^MA\b/i.test(b.fach || ""))) { S.spezialRaus.push(p); S.praktika[p.idpraktikum] = { ...p, ausblendGrund: "Spezialpraktikum: " + z }; continue; }
    const ziel = /Halbtag/i.test(z) ? "Halbtag" : /Quartal/i.test(z) ? "Quartal" : /Profil/i.test(z) ? "Profil" : "";
    if (ziel) S.praktika[p.idpraktikum] = { ...p, gruppe: ziel, spezialText: z };
  }
  // Spezial → Halbtag: Periode A–D aus dem Zeitraum (gleiche Daten wie die regulären Halbtagspraktika dieses Jahres)
  const iso = (d) => { const m = String(d || "").match(/(\d\d)\.(\d\d)\.(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : ""; };
  const PER = { 1: "A", 10: "B", 11: "C", 12: "D" }, perZeit = {};
  for (const p of Object.values(S.praktika)) if (p.gruppe === "Halbtag" && PER[p.art] && !p.spezialText) {
    const k = p.jahr + PER[p.art], z = (perZeit[k] ||= { von: "9999", bis: "0000" });
    if (iso(p.von) && iso(p.von) < z.von) z.von = iso(p.von); if (iso(p.bis) > z.bis) z.bis = iso(p.bis);
  }

    const eigene = p.lektionen.filter((l) => !/hosp|besp|ausfall/i.test(l.klasse || ""));
    const matheBesuch = (p.besuche || []).some((b) => /^MA\b/i.test(b.fach || ""));
    // Halbtag: nur wer in dieser Periode gar keine eigene Mathe-Lektion hat, fällt weg. Alles Unklare bleibt drin

    const zus = doppelMitPause(eigene);
    if (eigene.length === p.lektionen.length && zus.length === eigene.length) continue;
    S.praktika[p.idpraktikum] = { ...p, lektionen: zus, ...(eigene.length < p.lektionen.length ? { hospitationen: p.lektionen.length - eigene.length } : {}) };

  S.alias = {};
  const teile = {};

      besuche: l.flatMap((p) => p.besuche || []), fachbesuche: l.reduce((n, p) => n + (Number(p.fachbesuche) || 0), 0),
      mentoratsbesuche: l.reduce((n, p) => n + (Number(p.mentoratsbesuche) || 0), 0),
      kontakte: a.kontakte || (rest.find((p) => p.kontakte) || {}).kontakte,
      lektionen: mitL.length ? mitL.flatMap((p) => p === a ? p.lektionen : p.lektionen.map((x) => ({ ...x, link: p.link }))) : a.lektionen };
    if (!a.besuche && !rest.some((p) => p.besuche)) delete m.besuche;
    for (const p of rest) { delete S.praktika[p.idpraktikum]; S.alias[p.idpraktikum] = a.idpraktikum; }

/* Ordner «Protokolle» einlesen (nur Namen): Ordner je Person mit ihren Dateien */
async function protokolleEinlesen() {
  try {
    const basis = await protokollBasis(false), map = {};
    for await (const [name, h] of basis.entries()) {
      if (h.kind !== "directory") continue;
      const dateien = [];
      for await (const [n, f] of h.entries()) if (f.kind === "file" && !n.startsWith(".")) dateien.push(n);
      map[name] = dateien;
    }
    S.protokolle = map; berechnen(); zeichnen();
  } catch (e) { S.protokolle = {}; }
}
/* Datei «UB Nachname PK03 clu 260204.pdf» -> Gruppe und Studienjahr (Aug–Jul) */
function protokollInfo(datei) {
  const pk = (datei.match(/PK0([123])/i) || [])[1];
  const d = datei.match(/(?<!\d)(\d{2})(\d{2})(\d{2})(?!\d)/);
  let jahr = "";
  if (d) { const y = Number(d[1]), m = Number(d[2]); if (m >= 1 && m <= 12) jahr = m >= 8 ? `${String(y).padStart(2, "0")}-${String(y + 1).padStart(2, "0")}` : `${String(y - 1).padStart(2, "0")}-${String(y).padStart(2, "0")}`; }
  const t = datei.toLowerCase();
  const gruppe = { 1: "Halbtag", 2: "Profil", 3: "Quartal" }[pk]
    || (/halbtag|htp|hps/.test(t) ? "Halbtag" : /profil|ppk|pkpr/.test(t) ? "Profil" : /quartal/.test(t) ? "Quartal" : "");
  // Semester statt Datum: HS23 / Herbstsemester 2023 -> 23-24, FS24 / SP24 / Frühlingssemester 2024 -> 23-24
  const sem = t.match(/\b(hs|fs|sp|spr)\s?(\d{2})\b/) || t.match(/(herbst|frühlings|fruehlings)semester\s*(?:20)?(\d{2})/);
  if (!jahr && sem) { const y = Number(sem[2]); jahr = /^h/.test(sem[1]) ? `${String(y).padStart(2, "0")}-${String(y + 1).padStart(2, "0")}` : `${String(y - 1).padStart(2, "0")}-${String(y).padStart(2, "0")}`; }
  return { gruppe, jahr };
}
async function eintraegeLaden() {
  const liste = [], gesehen = new Set();
  try {
    const wurzel = await verzeichnis("eintraege");
    for await (const [name, d] of wurzel.entries()) {
      if (d.kind !== "directory") continue;
      for await (const [dn, f] of d.entries()) {
        if (f.kind !== "file" || !dn.endsWith(".json")) continue;
        try {
          const e = JSON.parse(await (await f.getFile()).text());
          if (!e.id || gesehen.has(e.id)) continue;      // Konfliktkopien enthalten dieselbe id
          gesehen.add(e.id); liste.push(e);
        } catch (err) { /* halb synchronisierte Datei: beim nächsten Mal */ }
      }
    }
  } catch (e) { /* noch keine Einträge */ }
  liste.sort((a, b) => a.zeit.localeCompare(b.zeit));
  S.eintraege = liste;
  berechnen();
  zeichnen();
}
async function eintragen(e) {
  if (!S.ich) { meldung("Bitte oben rechts «Ich bin» wählen."); return false; }
  const zeit = new Date().toISOString();
  const id = zeit.replace(/[:.]/g, "") + "-" + Math.random().toString(36).slice(2, 8);
  const eintrag = Object.assign({ id, zeit, wer: S.ich }, e);
  await schreibeJSON(`eintraege/${S.ich}/${id}.json`, eintrag);
  S.eintraege.push(eintrag);
  berechnen(); zeichnen();
  return eintrag;
}
/* «Nein, doch nicht»: Einträge zurücknehmen – nichts wird gelöscht, ein Eintrag «storno» hebt sie auf */

const storniert = () => new Set(S.eintraege.filter((e) => e.typ === "storno").map((e) => e.bezug));

/* ---------- Rechnen: Stand, Besuch nötig, Verlauf ---------- */
let R = { praktika: [], personen: {} };
function berechnen() {
  const altNach = {};
  for (const a of S.alt) altNach[a.schluessel] = a;
  const spezialNach = {};

  // Personen
  const personen = {};
  for (const p of Object.values(S.personen)) {

    const id = "alt:" + a.schluessel;
    personen[id] = { id, name: `${a.name} ${a.vorname}`, studiengang: a.studiengang, faecher: [], alt: a, spezial: [], praktika: [], notizen: [], nurAlt: true };
  }

    if (e.praktikum) (proPrakt[(S.alias || {})[e.praktikum] || e.praktikum] ||= []).push(e);
    if (e.typ === "bemerkung" && e.person && personen[e.person]) personen[e.person].notizen.push(e);
    if (e.typ === "achtung" && e.person && personen[e.person]) (personen[e.person].achtungen ||= []).push(e);
    if (e.typ === "person" && e.person && personen[e.person]) {   // Studiengang/Fächer von Hand geändert (gilt für alle)
      if (e.studiengang != null) personen[e.person].studiengang = e.studiengang;
      if (e.faecher) personen[e.person].faecher = e.faecher;
      personen[e.person].angepasst = e.wer;
    }
    if (e.typ === "be_fach" && e.person && personen[e.person]) personen[e.person].beFach = { fach: e.fach || "", wer: e.wer, quelle: e.quelle || "", zeit: e.zeit };
    if (e.typ === "achtung_weg" && e.person && personen[e.person]) personen[e.person].achtungen = (personen[e.person].achtungen || []).filter((a) => a.id !== e.bezug);
  }

  const liste = [], ausgeblendet = [], fremdBesucht = [], wegGebucht = [];
  for (const pr of Object.values(S.praktika)) {
    const person = personen[pr.idstudent];
    const ein = [...(proPrakt[pr.idpraktikum] || [])].reverse().find((e) => e.typ === "ausblenden" || e.typ === "einblenden");
    if (ein && ein.typ === "ausblenden") { ausgeblendet.push({ ...pr, person, grund: ein.text || "" }); continue; }
    if (!ein) {   // automatisch weggelassen – lässt sich unten bei «Entfernt» wieder aufnehmen
      if (pr.weg) {   // im Praktikumstool gelöscht: aus den Listen, aber wer gebucht hatte, sieht es unter «Meine Termine» mit Vermerk
        const x = { ...pr, person, eintraege: proPrakt[pr.idpraktikum] || [], quelle: "tool" };
        standBestimmen(x);
        if (x.wer && !x.eintraege.some((e) => e.typ === "weg_gesehen" && e.wer === x.wer)) wegGebucht.push(x);
        ausgeblendet.push({ ...x, grund: pr.ausblendGrund }); continue;
      }
      if (pr.ausblendGrund) { ausgeblendet.push({ ...pr, person, grund: pr.ausblendGrund }); continue; }
      // Mathe-Fachbesuch durch jemanden ausserhalb des Teams (im Tool: mehr «Fach-besuche», als das Team gebucht hat) – nicht unsere Sache
      const teamTage = new Set((pr.besuche || []).filter((b) => /^MA\b/i.test(b.fach || "") && teamKuerzel(b.dozent)).map((b) => b.datum));
      const fremd = [...new Set((pr.besuche || []).filter((b) => /^MA\b/i.test(b.fach || "") && !teamKuerzel(b.dozent)).map((b) => b.dozent))];
      if ((Number(pr.fachbesuche) || 0) > teamTage.size && fremd.length && !(proPrakt[pr.idpraktikum] || []).length) { ausgeblendet.push({ ...pr, person, grund: "Mathe-Besuch macht " + fremd.join(", ") }); continue; }
    }
    const x = { ...pr, person, eintraege: proPrakt[pr.idpraktikum] || [], quelle: "tool" };
    standBestimmen(x);

  }
  // Praktika nur aus der alten Liste (Jahre, die nicht importiert sind)
  for (const person of Object.values(personen)) {
    const a = person.alt; if (!a) continue;
    for (const [feld, gruppe] of [["pk01", "Halbtag"], ["pk02", "Profil"], ["pk03", "Quartal"], ["diplom", "Abschluss"]]) {

    // von Hand zurückgeholt bzw. ins Archiv gelegt (gilt für alle)
    const vonHand = S.eintraege.filter((e) => e.typ === "archiv" && e.person === person.id).pop();

  }
  // vorhandene Protokolle (Ordner «Protokolle») den Praktika zuordnen: gleiche Gruppe, gleiches Studienjahr
  if (S.protokolle) {
    const ordnerNach = {};
    for (const name of Object.keys(S.protokolle)) { const n = nameNorm(name); (ordnerNach[n.split(" ").slice(0, 2).join(" ")] ||= []).push(name); }
    for (const person of Object.values(personen)) {
      const n = nameNorm(person.name), kand = (ordnerNach[n.split(" ").slice(0, 2).join(" ")] || []).filter((o) => nameNorm(o) === n || nameNorm(o).startsWith(n + " "));

      }
    }
  }

  for (const person of Object.values(personen)) for (const x of person.praktika) {
    if (x.wer || x.stand !== "besucht") continue;
    const k = (x.berichte || []).map((b) => (b.wer || "").toLowerCase()).filter(Boolean).map((w) => TIPPFEHLER[w] || w)[0];
    if (k) { x.wer = k; x.werAusBericht = true; x.besuchtVon = [k]; person.besucher.add(k); }
  }
  for (const x of liste) noetigBestimmen(x);
  bereinigungZuordnen(liste);
  for (const person of Object.values(personen)) for (const x of person.praktika) if (x.quelle === "alt") noetigBestimmen(x);
  R = { praktika: liste, personen, ausgeblendet, wegGebucht };
}

function standBestimmen(x, altBesuch) {
  // aus der alten Liste (gleiches Jahr)
  const a = x.person && x.person.alt;
  const feld = { Halbtag: "pk01", Profil: "pk02", Quartal: "pk03", Abschluss: "diplom" }[x.gruppe];
  let alt = altBesuch || (a && a[feld] && a[feld].sj === x.jahr ? a[feld] : null);
  if (!altBesuch && alt && x.gruppe === "Halbtag") {
    const per = (periode(x).match(/Periode ([A-D])/) || [])[1];
    const altPer = (alt.periode || "").trim();
    // passt nur, wenn die Periode stimmt; ohne Periode in der alten Liste: nur das Praktikum mit Mathe-Besuch
    if (altPer ? altPer !== per : !(x.fachbesuche > 0)) alt = null;
  }
  let wer = alt && alt.wer ? TIPPFEHLER[alt.wer] || alt.wer : "", stand = alt && alt.status ? alt.status : "", art = alt && alt.art ? alt.art : "", datum = alt && alt.datum ? alt.datum : "";
  if (stand === "besucht" && !wer) stand = "";

  let termin = null;
  if (x.quelle === "tool" && x.besuche) {
    const doz = (S.einst.dozierende || []).filter((d) => d.name);
    for (const v of x.besuche.filter((v) => v.fach === "MA")) {
      const text = v.dozent.toLowerCase();
      const d = doz.find((d) => d.name.toLowerCase().split(/\s+/).every((t) => text.includes(t)));
      if (!d) continue;   // Mentor/in o.ä. in einer Mathe-Lektion: zählt nicht als Fachdidaktik-Besuch
      if (!wer) wer = d.kuerzel;
      if (d.kuerzel === wer) {
        // Lektion = Block, in dem der Besuch liegt (Doppellektion: auch die zweite Lektion)
        const l = (x.lektionen || []).find((l) => l.datum === v.datum && (l.zeit === v.zeit || (l.zeit < v.zeit && v.zeit < (l.bis || "")))) || {};
        if (!termin) termin = { datum: v.datum, zeit: l.zeit || v.zeit, bis: l.bis || "", lektion: l.id || "", imTool: true };

      const text = g.toLowerCase();
      const d = doz.find((d) => d.name.toLowerCase().split(/\s+/).every((t) => text.includes(t)));
      if (d) {
        if (!wer) wer = d.kuerzel;
        if (d.kuerzel === wer) termin = { datum: l.datum, zeit: l.zeit, bis: l.bis, lektion: l.id, imTool: true };
        if (stand !== "besucht") stand = l.datum < new Date().toISOString().slice(0, 10) ? "besucht" : "gebucht";
        if (stand === "besucht" && !datum) datum = l.datum;
      }
    }
  }

  // Eine Buchung im Praktikumstool, die erst nach einer Korrektur hier eingelesen wurde, gilt: die Korrektur ist dann veraltet.
  const toolBuchung = termin && termin.imTool ? { wer, termin, stand } : null;
  let doppelt = [], terminZeit = "";
  const perBuchst = x.gruppe === "Halbtag" ? (periode(x).match(/Periode ([A-D])/) || [])[1] : "";
  const toolGeholt = (S.geholt || {})[x.gruppe === "Halbtag" ? `${x.jahr}|Halbtag|${perBuchst}` : `${x.jahr}|${x.gruppe}`] || S.stammStand || "";
  for (const e of x.eintraege) {
    if (e.typ === "uebernehmen") { if (wer && wer !== e.wer && stand !== "besucht") doppelt.push(e.wer); else { wer = e.wer; if (e.termin) { termin = e.termin; terminZeit = e.zeit; } if (stand !== "besucht" && stand !== "gebucht") stand = "übernommen"; } }
    if (e.typ === "termin" && e.wer === wer) { termin = e.termin || null; terminZeit = e.zeit; }
    if (e.typ === "abgeben") doppelt = doppelt.filter((w) => w !== e.wer);
    if (e.typ === "abgeben" && e.wer === wer) {
      // Abgegeben (und im Praktikumstool gleich gelöscht, bestätigt mit «OK»): gilt sofort, auch wenn das letzte Holen
      // die Buchung noch zeigt. Steht sie nach dem nächsten Holen immer noch im Tool, gilt wieder das Tool.

      wer = ""; termin = null; if (stand === "übernommen" || stand === "gebucht") stand = "";

    }

    if (e.typ === "erledigt") { stand = "besucht"; datum = e.datum || e.zeit; if (!wer) wer = e.wer; if (e.art) art = e.art; }
    if (e.typ === "korrektur" && toolBuchung && e.stand === "offen" && S.stammStand && e.zeit < S.stammStand) continue;
    if (e.typ === "korrektur") {   // von Hand korrigiert (Studierende): gilt ab hier

    if (toolBuchung && toolBuchung.wer === wer) {
      if (toolBuchung.termin.datum !== termin.datum || (termin.zeit && toolBuchung.termin.zeit !== termin.zeit)) x.toolAbweichung = toolBuchung.termin;
    } else if (!toolBuchung) x.toolFehlt = true;
  }
  // Doppellektion, im Tool aber nur ein Teil gebucht (Fall Hotz, 12.11.2026)
  x.halbGebucht = null;
  if (toolBuchung && x.stand === "gebucht" && termin && termin.imTool) {
    const l = (x.lektionen || []).find((l) => l.datum === termin.datum && l.zeit === termin.zeit);
    const n = (x.besuche || []).filter((v) => v.fach === "MA" && v.datum === termin.datum && v.zeit >= termin.zeit && v.zeit < ((l && l.bis) || termin.zeit + "~") && teamKuerzel(v.dozent) === wer).length;
    if (l && (l.anzahl || 1) > 1 && n && n < l.anzahl) x.halbGebucht = { gebucht: n, anzahl: l.anzahl, l };
  }
  x.besuchtVon = wer && (x.stand === "besucht" || x.stand === "übernommen" || x.stand === "gebucht") ? [wer] : [];
  x.notizen = x.eintraege.filter((e) => e.typ === "notiz");
  // Berichte: je Dateiname der neueste Eintrag; «bericht_weg» entfernt ihn
  const ber = {};
  for (const e of x.eintraege) { if (e.typ === "bericht") ber[e.datei] = { ...e, app: true }; if (e.typ === "bericht_weg") delete ber[e.datei]; }
  x.berichte = Object.values(ber);
  x.berichteWeg = new Set(x.eintraege.filter((e) => e.typ === "bericht_weg").map((e) => e.datei));
}

/* Bereinigungslisten der Praktikumsabteilung (Rike, 12.11.2026): Hinweise je Praktikum.
   Mit Datum: gilt, solange die Buchung (gleiche Person, gleicher Tag) noch besteht – wer im Tool umbucht oder austrägt,
   sieht den Hinweis nach dem nächsten Holen nicht mehr. Ohne Datum: Hinweis bleibt (z.B. «zweiter Fachbesuch wünschenswert»). */
/* «erledigt ✕» (Eintrag regel_ok) beim aktuellen Termin: alle Hinweise zu diesem Termin ausblenden – auch das ⚠ in den Listen */
function hinweisErledigt(x) { return !!(x.termin && x.eintraege.some((e) => e.typ === "regel_ok" && e.termin === x.termin.datum + " " + x.termin.zeit)); }
function bereinigungZuordnen(liste) {
  const b = S.bereinigung || {}, nach = {};
  for (const f of b.faelle || []) (nach[nameSchluessel(f.name)] ||= []).push(f);
  for (const x of liste) {
    x.bereinigung = [];

    const weg = hinweisErledigt(x);

    for (const f of nach[nameSchluessel(x.person.name)] || []) {

      // Termin nach dem Einlesen der Liste in der App angepasst/neu übernommen (und im Tool bestätigt): gilt als bereinigt
      if (f.datum && x.eintraege.some((e) => ["termin", "uebernehmen"].includes(e.typ) && f.wer.includes(e.wer) && (e.zeit || "").slice(0, 10) >= (b.eingelesen || "9999"))) continue;
      if (f.datum) {
        const imTool = (x.besuche || []).some((v) => v.fach === "MA" && v.datum === f.datum && (!f.wer.length || f.wer.includes(teamKuerzel(v.dozent))));
        const inApp = x.termin && x.termin.datum === f.datum && (!f.wer.length || f.wer.includes(x.wer));
        if (!imTool && !inApp) continue;   // umgebucht oder ausgetragen: erledigt
        if (f.wer.length && !(x.wer && f.wer.includes(x.wer))) continue;   // in der App abgegeben: erledigt
      } else if (f.wer && f.wer.length && !(x.wer && f.wer.includes(x.wer))) continue;   // «drei Fachbesuche»: nur solange unser Besuch steht
      x.bereinigung.push(f);
      const kurz = f.regel.split(/ → /)[0];
      x.achtung.push({ kategorie: "Praktikumsabteilung (Bereinigung " + datumText(b.eingelesen || "") + ")", hinweis: f.regel + (f.datum ? ` (${kurzDatum(f.datum)})` : "") + (f.bemerkung ? " – " + f.bemerkung : ""),
        stufe: f.zwingend ? "zwingend" : "info", etikett: /Profilpraktikum stattgefunden/.test(kurz) ? "prüfen: Profil besucht" : /drei Fachbesuchen/.test(kurz) ? "3 Fachbesuche" : /Zweiter Fachbesuch/.test(kurz) ? "2. Besuch erwünscht" : "Bereinigung" });
      if (f.zwingend && x.noetig !== "ja" && !x.eintraege.some((e) => e.typ === "noetig" && e.wert)) {
        x.noetig = "ja"; x.warum = "Praktikumsabteilung: " + kurz;
        if (x.stand === "nicht nötig") x.stand = "offen";

}
/* SK und Master B: Quartal Phase I–II / III–IV (Art 24/25) oder Studiengang SK */
function beRelevant(x) { return x.gruppe === "Quartal" && ([24, 25].includes(Number(x.art)) || /^SK/i.test((x.person && x.person.studiengang) || x.studiengang || "")); }
function noetigBestimmen(x) {
  const p = x.person, spez = (p.spezial || []).filter((f) => f.jahr === x.jahr);
  x.achtung = spez.filter((f) => f.stufe === "zwingend" || f.stufe === "prüfen");
  // eigene Vermerke «Achtung: im Profil/Quartal besuchen» gelten für dieses Praktikum ab dem aktuellen Studienjahr
  const eigene = (p.achtungen || []).filter((a) => a.fuer === x.gruppe && (x.jahr || "") >= S.einst.studienjahr && x.stand !== "besucht");
  for (const a of eigene) x.achtung.push({ kategorie: "Achtung (" + a.wer + ")", hinweis: `im ${a.fuer} besuchen${a.text ? ": " + a.text : ""}`, stufe: "zwingend" });
  const uebersteuert = [...x.eintraege].reverse().find((e) => e.typ === "noetig");
  let n, warum;
  if (x.gruppe === "Profil") { n = "optional"; warum = "Profil: freiwillig, zählt für die Quote"; }
  else if (x.gruppe === "Halbtag") { n = "ja"; warum = "Halbtagespraktikum"; }
  else if (x.gruppe === "Quartal") {
    const profile = p.praktika.filter((y) => y.gruppe === "Profil" && y !== x);
    const regulaer = profile.some((y) => (y.stand === "besucht" || (y.stand === "gebucht" && (y.jahr || "") < x.jahr)) && y.besuchsart !== "Wertschätzung");
    const laeuft = profile.some((y) => y.jahr === x.jahr && y.stand !== "besucht");
    const erneut = p.alt && p.alt.erneut;
    // Spezialfall «Mentoratsbesuch + beide/drei Studienfächer» (SK-Quartal) nennt kein Fach: Mathe ist nur nötig,
    // wenn Mathe im Profil noch nicht besucht wurde (Rike, 12.11.2026, Fälle Dihr und Wyrsch). Sonst «optional» mit
    // Hinweis «Achtung: im Profil schon besucht» (⚠ bleibt sichtbar, zwingt aber nichts). Nennt der Hinweis MA, gilt er.
    x.spezialErfuellt = null; x.profilBesuchtVon = "";

      x.profilBesuchtVon = pw;
    }
    // BE-Masterprüfung (Checkliste 2026/27): SK/Master B erhalten im Quartal im Fach mit BE-Masterprüfung zwingend einen Fachbesuch;
    // sonst gilt «nur Fachbesuch, wenn dieser im Profilpraktikum noch nicht stattgefunden hat» (Rike, 12.11.2026)
    const be = beRelevant(x) && p.beFach ? p.beFach.fach : "";

      const et = be ? `Profil besucht · BE ${be}` : "prüfen: BE-Fach?";
      x.achtung = x.achtung.map((f) => f.stufe === "info" && f.etikett === "prüfen: Profil besucht" ? { ...f, etikett: et } : f);
    }

    else if (erneut) { n = "ja"; warum = "soll erneut besucht werden (alte Liste)"; }
    else if (regulaer && be) { n = "nein"; warum = `im Profil schon besucht; BE-Masterprüfung in ${be} – Checkliste: Quartal nur, wenn im Profil noch nicht besucht`; }
    else if (regulaer && x.spezialErfuellt) { n = "optional"; warum = `Spezialfall «${x.spezialErfuellt[0].hinweis}» – Achtung: im Profil schon besucht${x.profilBesuchtVon || ""}. BE-Prüfungsfach unbekannt: unter Aktualisieren › Regeln Block › BE-Masterprüfung eintragen (MA = nötig, anderes Fach = nein)`; }
    else if (regulaer) { n = "nein"; warum = "im Profil schon besucht"; }
    else if (laeuft) { n = "später"; warum = "Profil läuft noch"; }
    else { n = "ja"; warum = profile.length ? "im Profil nicht regulär besucht" : "kein Profilbesuch bekannt"; }
  } else { n = "ja"; warum = x.gruppe; }
  if (x.achtung.some((f) => f.stufe === "zwingend")) { n = "ja"; warum = x.achtung.map((f) => f.hinweis).join(" · "); }
  const nicht = ["Profil", "Quartal"].includes(x.gruppe) && spez.find((f) => f.stufe === "nicht");
  if (nicht && !x.achtung.some((f) => f.stufe === "zwingend")) { n = "nein"; warum = "Spezialfall: " + nicht.hinweis; }
  if (uebersteuert && uebersteuert.wert) { n = uebersteuert.wert; warum = `von Hand (${uebersteuert.wer}): ${uebersteuert.text || ""}`; }
  if (x.stand === "abgebrochen") { n = "nein"; warum = "Praktikum abgebrochen"; }
  x.noetig = n; x.warum = warum;
  if (x.stand === "offen" && n === "nein") x.stand = "nicht nötig";
  // vergangene Studienjahre: «offen» heisst hier, es hat kein Besuch stattgefunden
  if (x.stand === "offen" && x.jahr && x.jahr < S.einst.studienjahr) x.stand = "nicht besucht";

  // In beiden Fällen geht es erst nach «OK» weiter.
  let antwort = "ja";

  } else antwort = await toolBestaetigen("eintragen", alle.map((y, n) => { const l = y === x ? a : (y.lektionen || []).find((b) => b.datum === a.datum && b.zeit === a.zeit) || a; REFS.push(toolLink(y, l.id)); return [y.person.name, REFS.length - 1, "doppel" + (n + 1)]; }), { offen: false, wann: blockText(a) });
  if (antwort === "nein") { await zuruecknehmen(neu); S.nachBuchen = null; meldung(meinesSchon ? "Nicht geändert – der alte Termin gilt." : "Nicht gebucht – wieder offen."); return; }

/* Termine, die nach der Checkliste nie gehen – sie werden gar nicht angeboten */

    let tage = 0; for (let d = new Date(von + "T12:00"); d.toISOString().slice(0, 10) < datum; d.setDate(d.getDate() + 1)) if (d.getDay() % 6) tage++;

  if (von && x.gruppe === "Quartal" && ersteKal) { const e = new Date(von + "T12:00"); e.setDate(e.getDate() + ersteKal); if (datum < e.toISOString().slice(0, 10)) return "erste Praktikumswoche"; }
  const arb = x.gruppe === "Profil" ? S.einst.arbeitssitzungProfil : x.gruppe === "Quartal" ? S.einst.arbeitssitzungQuartal : "";

/* Die Person: nicht 2 Besuche am selben Tag, höchstens 2 pro Woche – gezählt werden nur Besuche des Teams.

   Nicht mitgezählt: dieser Mathe-Besuch selbst und Besuche genau zur selben Zeit (Doppelbesuch). */
function besuchsRegeln(x, datum, zeit) {
  const w = [];
  const eigen = (v) => (v.datum === datum && v.zeit === zeit) || (x.termin && v.datum === x.termin.datum && (v.mathe || v.zeit === x.termin.zeit));
  const andere = ((x.person && x.person.praktika) || []).filter((y) => y !== x && y.termin);
  // Nur Besuche des Teams (Kürzel in den Einstellungen) – Mentor/innen und andere Fächer zählen nicht
  const roh = [...(x.besuche || []).filter((v) => v.fach === "MA" && teamKuerzel(v.dozent)).map((v) => ({ datum: v.datum, zeit: v.zeit, wer: teamKuerzel(v.dozent), mathe: true })),
               ...(x.besuche ? [] : (x.lektionen || []).filter((l) => l.gebucht && l.gebucht.length).map((l) => ({ datum: l.datum, zeit: l.zeit, wer: l.gebucht.join(), mathe: true }))),
               ...andere.map((y) => ({ datum: y.termin.datum, zeit: y.termin.zeit, wer: y.wer }))];
  const besuche = [...new Set(roh.filter((v) => !eigen(v)).map((v) => v.datum + "|" + v.wer))].map((k) => k.split("|")[0]);
  if (besuche.includes(datum)) w.push("an diesem Tag hat die Person schon einen Besuch");

  const maxW = Number(regel("maxProWoche")) || 2;

/* Checkliste 2026/27 (Praktikumsabteilung) */
function terminWarnungen(x, datum, zeit) {

  const von = datumAus(x.von), bis = datumAus(x.bis);
  if (von && datum < von) w.push("vor Beginn des Praktikums");
  if (bis && datum > bis) w.push("nach Ende des Praktikums");
  // Halbtagespraktikum: eigene Regeln (Doppelbesuche am selben Vormittag sind normal)
  if (x.gruppe === "Halbtag") return w;
  if (bis && datum === bis) w.push("nicht am letzten Praktikumstag");
  if (von && x.gruppe === "Profil") {
    let tage = 0; for (let d = new Date(von + "T12:00"); d.toISOString().slice(0, 10) < datum; d.setDate(d.getDate() + 1)) if (d.getDay() % 6) tage++;
    if (tage < 3) w.push("nicht an den ersten 3 Praktikumstagen");
  }
  if (von && x.gruppe === "Quartal") { const e = new Date(von + "T12:00"); e.setDate(e.getDate() + 7); if (datum < e.toISOString().slice(0, 10)) w.push("nicht in der ersten Praktikumswoche"); }
  const arb = x.gruppe === "Profil" ? S.einst.arbeitssitzungProfil : x.gruppe === "Quartal" ? S.einst.arbeitssitzungQuartal : "";
  if (arb && datum === arb && vormittag(zeit)) w.push("Vormittag der Arbeitssitzung");
  if (nachFerien(x, datum, zeit)) w.push("nicht am " + nachFerien(x, datum, zeit));
  // eigene Besuche: in der Regel ein Besuch pro Halbtag
  // ausser genau zur selben Zeit (Doppelbesuch: zwei Studierende in derselben Lektion)
  const meine = R.praktika.filter((y) => y !== x && y.wer === S.ich && y.termin && y.termin.datum === datum && y.termin.zeit !== zeit && vormittag(y.termin.zeit) === vormittag(zeit));
  if (meine.length) w.push(`am selben ${vormittag(zeit) ? "Vormittag" : "Nachmittag"} schon: ${meine.map((y) => y.person.name).join(", ")}`);
  w.push(...besuchsRegeln(x, datum, zeit));
  return w;
}

/* Meine Termine: was nicht zusammenpasst – zu spät übernommen; App und Tool verschieden */
function pruefKasten(sj) {
  const spaet = R.praktika.filter((x) => x.jahr === sj && S.ich && x.wer && x.wer !== S.ich && (x.doppelt || []).includes(S.ich));

  let h = "";   // Checkliste/Bereinigung stehen beim Termin selbst (Rike, 12.11.2026), kein Kasten oben
  if (spaet.length) h += `<div class="karte" style="border:2px solid var(--achtung);margin-bottom:14px"><b class="rot">⚠ Jemand war schneller</b>

    <table class="liste"><tbody>${spaet.map((x) => `<tr><td><span class="name" onclick="detailZeigen(REFS[${ref(x.person.id)}])">${esc(x.person.name)}</span></td><td>${esc(praktKurz(x))}</td>
      <td class="klein">übernommen von <b>${esc(x.wer)}</b>${x.termin ? " · " + esc(kurzDatum(x.termin.datum) + " " + (x.termin.zeit || "")) : ""}</td>
      <td style="white-space:nowrap">${x.link ? `<button class="knopf klein" onclick="toolOeffnen(${ref(toolLink(x, ""))})">Tool ↗</button> ` : ""}<button class="knopf klein" title="Meine Übernahme zurücknehmen" onclick="zuSpaetErledigt(${ref(x.idpraktikum)})">ausgetragen – erledigt ✕</button></td></tr>`).join("")}</tbody></table></div>`;
  if (abw.length) h += `<div class="karte" style="border:2px solid var(--achtung);margin-bottom:14px"><b class="rot">⚠ App und Praktikumstool stimmen nicht überein</b>
    <p class="klein" style="margin:4px 0 8px">Beim letzten Holen stand im Praktikumstool etwas anderes als hier. Bitte entscheiden, was gilt.</p>
    <table class="liste"><tbody>${abw.map((x) => `<tr><td><span class="name" onclick="detailZeigen(REFS[${ref(x.person.id)}])">${esc(x.person.name)}</span></td><td>${esc(praktKurz(x))}</td>
      <td class="klein">hier: <b>${esc(kurzDatum(x.termin.datum) + " " + (x.termin.zeit || ""))}</b> · im Tool: <b>${x.toolAbweichung ? esc(kurzDatum(x.toolAbweichung.datum) + " " + (x.toolAbweichung.zeit || "")) : "kein Besuch von dir eingetragen"}</b></td>
      <td style="white-space:nowrap">${x.toolAbweichung ? `<button class="knopf klein" onclick="toolTerminUebernehmen(${ref(x.idpraktikum)})">Termin aus dem Tool übernehmen</button> ` : ""}${x.link ? `<button class="knopf klein" onclick="toolOeffnen(${ref(toolLink(x, x.termin && x.termin.lektion))})">${x.toolAbweichung ? "Im Tool ändern ↗" : "Im Tool eintragen ↗"}</button>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
  return h;
}
/* Gebuchte Termine, die nicht zur Checkliste passen (meist direkt im Praktikumstool gebucht) oder Doppellektion nur halb gebucht.
   Eigene unter Meine Termine; alh sieht zusätzlich die des Teams (Rike, 12.11.2026: Fälle Mboup, Schelker, Hotz). */
function terminProbleme(x) {
  if (!x.termin || !x.termin.datum || !x.wer || !["gebucht", "übernommen"].includes(x.stand)) return [];
  const p = [];
  const g = terminGesperrt(x, x.termin.datum, x.termin.zeit, true);
  if (g && !(sonderProfil(x) && /^erste /.test(g))) p.push(g);
  for (const f of x.bereinigung || []) p.push("Praktikumsabteilung: " + f.regel.split(/ → /)[0] + (f.regel.includes(" → ") ? " – " + f.regel.split(/ → /)[1] : ""));
  if (x.halbGebucht) p.push(`Doppellektion ${x.halbGebucht.l.zeit}–${x.halbGebucht.l.bis}, im Tool nur ${x.halbGebucht.gebucht} von ${x.halbGebucht.anzahl} Lektionen gebucht`);
  return hinweisErledigt(x) ? [] : p;
}
/* Sonder-Profilpraktikum (nicht das reguläre «srfach3», z.B. Schelker SF/zsffpp 15.02.–05.03.2027): die offizielle Bereinigungsliste
   prüft es nicht; ob «nicht an den ersten 3 Praktikumstagen» gilt, ist unklar -> gelber Hinweis statt rot (Rike, 12.11.2026) */
function sonderProfil(x) { return x.gruppe === "Profil" && !!x.prid && x.prid !== "srfach3" && !(x.bereinigung || []).length; }
function terminUnsicher(x) {
  if (!x.termin || !x.termin.datum || !sonderProfil(x) || hinweisErledigt(x)) return [];
  const g = terminGesperrt(x, x.termin.datum, x.termin.zeit, true);
  return /^erste /.test(g || "") ? [`Verstösst eigentlich gegen die Regel «Nicht an den ersten ${Number(regel("profilErsteTage")) || 3} Praktikumstagen». Unsicher, ob das für ${x.person.name} (Sonderpraktikum ${x.person.studiengang || x.prid}) auch gilt. In der offiziellen Bereinigungsliste wurde es nicht angekreidet.`] : [];
}
function regelKasten(sj) {
  const alle = R.praktika.filter((x) => x.jahr === sj && terminProbleme(x).length);
  const meine = alle.filter((x) => x.wer === S.ich), team = S.ich === "alh" ? alle.filter((x) => x.wer !== S.ich) : [];
  if (!meine.length && !team.length) return "";
  const zeile = (x, eigen) => `<tr><td>${esc(kurzDatum(x.termin.datum) + " " + (x.termin.zeit || ""))}</td><td><span class="name" onclick="detailZeigen(REFS[${ref(x.person.id)}])">${esc(x.person.name)}</span></td><td>${esc(praktKurz(x))}${eigen ? "" : " · <b>" + esc(x.wer) + "</b>"}</td>
      <td class="klein rot">${esc(terminProbleme(x).join(" · "))}</td>
      <td style="white-space:nowrap">${x.link ? `<button class="knopf klein" onclick="toolOeffnen(${ref(toolLink(x, x.termin.lektion || ""))})">Tool ↗</button> ` : ""}${eigen ? `<button class="knopf klein" title="Bewusst so gebucht (z.B. abgesprochen) – Hinweis nicht mehr zeigen" onclick="regelOk(${ref(x.idpraktikum)})">passt so ✕</button>` : ""}</td></tr>`;
  return `<div class="karte" style="border:2px solid var(--achtung);margin-bottom:14px"><b class="rot">⚠ Bitte prüfen: Checkliste und Bereinigungsliste der Praktikumsabteilung</b>
    <p class="klein" style="margin:4px 0 8px">Gebuchte Termine (Stand letztes Holen), zu denen es einen Hinweis gibt. Wenn nötig im Praktikumstool ändern oder austragen – nach dem nächsten Holen verschwindet der Hinweis. Bleibt es bewusst so: «passt so».</p>
    <table class="liste"><tbody>${meine.map((x) => zeile(x, true)).join("")}${team.length ? `<tr><td colspan="5" class="klein leise" style="padding-top:8px">im Team (nur für dich sichtbar):</td></tr>` + team.map((x) => zeile(x, false)).join("") : ""}</tbody></table></div>`;
}
/* Bereinigung «drei Fachbesuche – evtl. einen streichen und bei Studierenden mit nur einem Fachbesuch planen»:
   zeigt beim Termin, wer im selben Jahr noch einen 2. Fachbesuch braucht und Mathe hat (Rike, 12.11.2026) */
function tauschKandidaten(x) {
  if (!(x.bereinigung || []).some((f) => /drei Fachbesuchen/.test(f.regel))) return "";
  const k = R.praktika.filter((y) => y.jahr === x.jahr && y.gruppe === "Profil" && (y.bereinigung || []).some((f) => /Zweiter Fachbesuch/.test(f.regel)));
  if (!k.length) return "";

    `<span class="name" onclick="detailZeigen(REFS[${ref(y.person.id)}])">${esc(y.person.name)}</span> <span class="leise">${esc(y.schulort)}${y.wer ? " · schon bei " + esc(y.wer) : ""}</span>`).join("<br>")}</div>`;
}

/* ---------- Kalender (Outlook) ----------
   Für alle: kommende eigene Besuche als .ics, je Besuch ein Eintrag genau über die Unterrichtszeit
   (Doppellektion = ein Block, Doppelbesuch = ein Eintrag). Oben «Alle Termine für Outlook», je Zeile 📅.
   Nur REISEPLAN_FUER: unten «Reiseplanung» – Besuch + Warten + Besprechung als ein Termin, Anreise/Reise dazwischen/Rückreise
   als eigene Termine. Wohnort und Minuten bleiben nur im Browser (localStorage), nie im Teams-Ordner. */
const REISEPLAN_FUER = ["alh"];
const zuMin = (z) => { const m = String(z || "").match(/(\d{1,2})[:.](\d\d)/); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
const ausMin = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(((m % 60) + 60) % 60).padStart(2, "0")}`;
function kalMeine() {
  const sj = fw("jahr", S.einst.studienjahr), tPrakt = Array.isArray(S.filter["t.prakt"]) ? S.filter["t.prakt"] : TERMIN_KAT;
  return R.praktika.filter((x) => S.ich && x.wer === S.ich && x.jahr === sj && tPrakt.includes(kategorie(x)));
}
function kalGruppen(liste, nurKommend = true) {
  const heute = new Date().toISOString().slice(0, 10), gruppen = {};
  for (const x of liste) {
    if (!x.termin || !x.termin.zeit || (nurKommend && (x.termin.datum < heute || x.stand === "besucht"))) continue;
    const k = [x.termin.datum, x.termin.zeit, x.schulhaus || x.schulort || ""].join("|");
    (gruppen[k] ||= { key: k, xs: [] }).xs.push(x);
  }
  return Object.values(gruppen).map((g) => {
    const x = g.xs[0], t = x.termin;
    const l = (x.lektionen || []).find((y) => (t.lektion && y.id === t.lektion) || (y.datum === t.datum && y.zeit === t.zeit)) || null;
    const von = zuMin(t.zeit), bis = zuMin(t.bis || (l && l.bis)) || von + 45 * ((l && l.anzahl) || 1);
    return { ...g, x, l, datum: t.datum, von, bis, ort: x.schulhaus || x.schulort || "Schule" };
  }).sort((a, b) => a.key.localeCompare(b.key));
}
function kalBesuchText(g) {
  const art = g.l && (g.l.anzahl || 1) > 1 ? `${g.l.anzahl}er-Lektion` : "Lektion";
  const pxl = g.xs.flatMap((y) => ((y.kontakte && y.kontakte.pxl) || []).filter((p) => p.mathe).map((p) => `PxL Mathe: ${p.name}${p.tel ? ", " + p.tel : ""}${p.mail ? ", " + p.mail : ""}`));
  return [...g.xs.map((y) => `${y.person.name} · ${praktKurz(y)}`), `Unterricht ${ausMin(g.von)}–${ausMin(g.bis)} (${art}${g.l && g.l.klasse ? ", Kl. " + g.l.klasse : ""})`,
    ...[...new Set(pxl)], "", "Praxisbesuche: " + SEITE];
}
const kalTitel = (g) => `Praxisbesuch ${g.xs.map((y) => y.person.name).join(" + ")} (${[...new Set(g.xs.map(praktKurz))].join(", ")})`;
const kalOrt = (g) => [g.x.schulhaus, g.x.schulort].filter(Boolean).join(", ");
const kalUid = (g, art) => `${art}-${g.xs.map((y) => y.idpraktikum).join("-")}-${g.datum}@mathe-phlu`;
function icsText(t) { return String(t || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1"); }
function icsFalten(zeile) {   // Zeilen höchstens 75 Bytes, Fortsetzung mit Leerzeichen

  const jahrgang = (p) => (p.alt && (p.alt.studiengang || "").match(/\d{2}/) || [])[0] || (p.praktika.find((x) => x.gruppe === "Halbtag") || {}).jahr || "";
  liste.sort((a, b) => sort === "studiengang" ? (a.studiengang || "").localeCompare(b.studiengang || "") || a.name.localeCompare(b.name)
    : sort === "jahrgang" ? String(jahrgang(b)).localeCompare(String(jahrgang(a))) || a.name.localeCompare(b.name) : a.name.localeCompare(b.name));
  // je Praktikum eine Zeile: Studienjahr (Periode) · Datum · Stand · Kürzel (NN = unbekannt)
  const eintrag = (x) => {
    const cls = { offen: "s-offen", "übernommen": "s-uebernommen", gebucht: "s-gebucht", besucht: "s-besucht", abgebrochen: "s-abbruch" }[x.stand] || "s-nicht";
    const per = x.gruppe === "Halbtag" ? ((periode(x).match(/Periode ([A-D])/) || [])[1] || (/^Einzel/.test(periode(x)) ? "Einzel" : "")) : "";
    const d = x.termin ? x.termin.datum : x.datum;
    const zt = ztOffen(x);
    if (zt) return `<div class="ue korr" title="${esc(ztTitel(zt))} · Klick: Stand korrigieren" onclick="korrigieren(${ref(x.idpraktikum)})"><span class="ue-j">${sjText(x.jahr)}${per ? " " + per : ""}</span><span class="chip s-zugeteilt">zugeteilt</span><b class="ue-w">${esc(zt.wer)}</b></div>`;
    const stand = { "übernommen": "gebucht" }[x.stand] || x.stand;
    const wer = ["besucht", "gebucht", "übernommen"].includes(x.stand) ? (x.wer || "NN") : "";
    return `<div class="ue korr" title="Klick: Stand korrigieren" onclick="korrigieren(${ref(x.idpraktikum)})"><span class="ue-j">${sjText(x.jahr)}${per ? " " + per : ""}</span><span class="chip ${cls}">${esc(stand)}</span><b class="ue-w">${esc(wer)}${berichtLinks(x, true)}</b></div>`;
  };
  const zelle = (p, g) => {
    const xs = p.praktika.filter((x) => x.gruppe === g);
    return xs.length ? xs.map(eintrag).join("") : `<span class="leise">–</span>`;
  };
  const sgs = [...new Set(Object.values(R.personen).map((p) => (p.studiengang || "").replace(/[\s.\d]/g, "")).filter(Boolean))].sort();
  return `<h2>Studierende${archiv ? " – Archiv" : ""}</h2>
  <div class="filter">
    <label title="Komma = oder · Leerzeichen = und · -Wort = ohne">Suche (Name, Ort, Schulhaus)<input type="search" id="sSuche" value="${esc(fw("ssuche", ""))}" oninput="sucheTippen(this.value)" placeholder="z.B. Arnold oder Sursee"></label>
    <label>Studienjahr<select onchange="setzeFilter('sSj',this.value)"><option value="alle">alle</option>${jahre().map((j) => `<option value="${j}" ${j === sjF ? "selected" : ""}>${sjText(j)}</option>`).join("")}</select></label>
    <label>Sortieren<select onchange="setzeFilter('sSort',this.value)">${[["name", "Name"], ["studiengang", "Studiengang"], ["jahrgang", "Jahrgang"]].map(([v, t]) => `<option value="${v}" ${v === sort ? "selected" : ""}>${t}</option>`).join("")}</select></label>

    <label>Studiengang<select onchange="setzeFilter('sg',this.value)"><option value="alle">alle</option>${sgs.map((s) => `<option ${s === sg ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
    <label class="haken" title="Archiv: alle Praktika abgeschlossen oder seit zwei Jahren kein Praktikum"><input type="checkbox" ${archiv ? "checked" : ""} onchange="setzeFilter('archiv',this.checked)"> Archiv zeigen (${imArchiv} abgeschlossen)</label>
    <label class="haken"><input type="checkbox" ${fw("nurAchtung", false) ? "checked" : ""} onchange="setzeFilter('nurAchtung',this.checked)"> nur mit ⚠ Achtung</label>
    <label class="haken"><input type="checkbox" ${fw("nurBemerkung", false) ? "checked" : ""} onchange="setzeFilter('nurBemerkung',this.checked)"> nur mit Bemerkung</label>

  </div>
  <table class="liste"><thead><tr><th colspan="4" class="p-info">Person</th><th class="pspalte p-halbtag">Halbtag</th><th class="pspalte p-profil">Profil</th><th class="pspalte p-quartal">Quartal</th><th colspan="2" class="p-bem">Achtung / Bemerkung</th></tr>
    <tr class="unterkopf"><th></th><th>Name</th><th>Studiengang</th><th>Fächer</th>${["p-halbtag", "p-profil", "p-quartal"].map((c) => `<th class="pspalte ${c}"><div class="ue"><span>${c === "p-halbtag" ? "Jahr Per." : "Jahr"}</span><span style="text-align:center">Stand</span><span>von</span></div></th>`).join("")}<th class="p-bem"></th><th></th></tr></thead><tbody>
  ${liste.map((p) => { const a = (p.achtungen || []).length || p.praktika.some((x) => x.achtung && x.achtung.length);
    const bem = [...(p.achtungen || []).map((x) => `<div class="rot">⚠ im ${esc(x.fuer)} besuchen${x.text ? ": " + esc(x.text) : ""}
        <button class="knopf klein" title="ändern" onclick="achtungSetzen(REFS[${ref(p.id)}], REFS[${ref(x.id)}])">ändern</button>
        <button class="knopf klein" title="löschen" onclick="achtungWeg(REFS[${ref(p.id)}], REFS[${ref(x.id)}])">✕</button></div>`),
                 ...p.notizen.slice(-1).map((x) => `<div>${esc(x.text.slice(0, 80))}</div>`), ...(!p.notizen.length && p.alt && p.alt.bemerkung ? [`<div class="leise">${esc(p.alt.bemerkung.slice(0, 80))}</div>`] : [])].join("");
    return `<tr class="${a ? "zeile-achtung" : ""}"><td>${a ? `<span class="achtung">⚠</span>` : ""}</td><td><span class="name" onclick="detailZeigen(REFS[${ref(p.id)}])">${esc(p.name)}</span>${p.archiv && !archiv ? ` <span class="klein leise">(im Archiv)</span>` : ""}${p.archiv ? `<div><button class="knopf klein haupt" title="Wieder zu den aktuellen Studierenden" onclick="archivSetzen(REFS[${ref(p.id)}], false)">zurückholen</button></div>` : ""}</td>
    <td class="korr" style="cursor:pointer" title="Klick: Studiengang und Fächer ändern" onclick="personAnpassen(REFS[${ref(p.id)}])">${esc(p.studiengang || "") || `<span class="leise">–</span>`}</td><td class="klein korr" style="cursor:pointer" title="Klick: Studiengang und Fächer ändern" onclick="personAnpassen(REFS[${ref(p.id)}])">${esc((p.faecher || []).join(", ")) || `<span class="leise">–</span>`}</td>
    <td class="pspalte p-halbtag">${zelle(p, "Halbtag")}</td><td class="pspalte p-profil">${zelle(p, "Profil")}</td><td class="pspalte p-quartal">${zelle(p, "Quartal")}</td><td class="klein p-bem">${bem}</td>
    <td style="white-space:nowrap"><button class="knopf klein" onclick="achtungSetzen(REFS[${ref(p.id)}])">Achtung / Bemerkung</button>
      ${p.archiv ? ""
        : p.archivVonHand ? `<button class="knopf klein" title="Wieder ins Archiv" onclick="archivSetzen(REFS[${ref(p.id)}], true)">ins Archiv</button>` : ""}</td></tr>`; }).join("")}
  </tbody></table>`;
}

async function personAnpassen(id) {
  const p = R.personen[id]; if (!p) return;
  if (!S.ich) return meldung("Bitte oben rechts «Ich bin» wählen.");
  const sg = await frage(`${p.name}\n\nStudiengang (z.B. SR24, SVA25, SK24):`, { art: "text", wert: p.studiengang || "" });
  if (sg === null) return;
  const f = await frage(`${p.name}\n\nFächer, mit Komma getrennt (z.B. MA, NT, DE):`, { art: "text", wert: (p.faecher || []).join(", ") });
  if (f === null) return;
  await eintragen({ typ: "person", person: id, studiengang: sg.trim(), faecher: f.split(/[,;\s]+/).map((t) => t.trim().toUpperCase()).filter(Boolean) });
  meldung("Gespeichert – gilt für alle.");
}
async function archivSetzen(personId, wert) {
  if (!S.ich) return meldung("Bitte oben rechts «Ich bin» wählen.");
  await eintragen({ typ: "archiv", person: personId, wert });
  meldung(wert ? "Ins Archiv gelegt." : "Zurückgeholt – steht wieder bei den aktuellen Studierenden.");
}

/* Praktika (aus Datei oder direkt vom Lesezeichen) in stamm/praktika.json übernehmen */
async function praktikaUebernehmen(liste) {
  const bestand = await leseJSON("stamm/praktika.json", { praktika: [], arten: {} });
  const nach = {}; for (const p of bestand.praktika) nach[p.idpraktikum] = p;
  let neu = 0, geaendert = 0; const proJahr = {};
  for (const d of liste) {
    Object.assign(bestand.arten ||= {}, d.arten || {});
    for (const p of d.praktika) {
      if (!p.idpraktikum || !p.idstudent) continue;
      const alt = nach[p.idpraktikum];
      if (alt && alt.lektionen && !p.lektionen) p.lektionen = alt.lektionen;   // Export ohne Stundenpläne
      // nur Mathe-Besuche des Teams speichern – Mentor/innen, andere Fächer und andere Personen interessieren nicht
      if (p.besuche) p.besuche = p.besuche.filter((v) => v.fach === "MA" && teamKuerzel(v.dozent));
      for (const l of p.lektionen || []) if (l.gebucht) l.gebucht = l.gebucht.filter((g) => teamKuerzel(g));
      if (alt && alt.besuche && !p.besuche) p.besuche = alt.besuche;
      if (alt && alt.kontakte && !p.kontakte) p.kontakte = alt.kontakte;
      if (!alt) neu++; else if (JSON.stringify(alt) !== JSON.stringify(p)) geaendert++;
      nach[p.idpraktikum] = p;
      proJahr[p.jahr + " " + p.gruppe] = (proJahr[p.jahr + " " + p.gruppe] || 0) + 1;
    }
  }
  bestand.stand = new Date().toISOString();
  // Was im Tool verschwunden ist (gelöscht, verschoben, anderes Fach), bleibt hier sonst stehen: beim vollständigen Holen
  // eines Jahres alles dieses Jahres und dieser Arten, das nicht mehr kam, als «weg» markieren – nicht löschen (Verlauf bleibt)
  const wegNeu = [];
  for (const d of liste) {
    if (d.einzeln || !Array.isArray(d.jahre) || !d.jahre.length) continue;
    const da = new Set((d.praktika || []).map((p) => String(p.idpraktikum))), arten = new Set(Object.keys(d.arten || {}).map(String));
    for (const p of Object.values(nach)) {
      if (!d.jahre.includes(p.jahr) || !arten.has(String(p.art))) continue;
      if (da.has(String(p.idpraktikum))) delete p.weg;
      else if (!p.weg) { p.weg = bestand.stand; wegNeu.push(p); }
    }
  }
  bestand.praktika = Object.values(nach);
  // für die Übersicht: wann welche Gruppe bzw. Halbtag-Periode zuletzt geholt wurde
  bestand.geholt ||= {};
  for (const d of liste) for (const p of d.praktika || []) {
    if (!p.jahr) continue;
    const g = p.gruppe === "Spezial" ? (/Quartal/i.test(p.zusatz || "") ? "Quartal" : /Profil/i.test(p.zusatz || "") ? "Profil" : "") : p.gruppe;
    if (g === "Halbtag") { const b = ((bestand.arten || {})[p.art] || "").match(/Periode ([A-D])/); if (b) bestand.geholt[`${p.jahr}|Halbtag|${b[1]}`] = bestand.stand; }
    else if (g === "Profil" || g === "Quartal") bestand.geholt[`${p.jahr}|${g}`] = bestand.stand;
  }
  await schreibeJSON("stamm/praktika.json", bestand);
  const fremdeArten = Object.entries(Object.assign({}, ...liste.map((d) => d.andereArten || {})));
  const wegText = wegNeu.length ? `<div class="karte" style="border-color:var(--achtung)"><b class="rot">⚠ ${wegNeu.length} Praktika sind im Praktikumstool nicht mehr zu finden</b> (gelöscht, verschoben oder anderes Fach). Sie stehen jetzt unten bei «Entfernt»:<ul>${wegNeu.map((p) => `<li>${esc(p.name)} · ${esc(p.gruppe)} ${esc(sjText(p.jahr))}${(p.besuche || []).filter((v) => v.fach === "MA").length ? " – <b>hatte einen Mathe-Besuch: " + esc([...new Set(p.besuche.filter((v) => v.fach === "MA").map((v) => v.dozent))].join(", ")) + "</b>" : ""}</li>`).join("")}</ul></div>` : "";
  const text = wegText + `${fremdeArten.length ? `<div class="karte" style="border-color:var(--achtung)"><b class="rot">⚠ Im Praktikumstool gibt es Mathe-Praktika in Arten, die hier nicht eingelesen werden:</b><ul>${fremdeArten.map(([id, t]) => `<li>${esc(t)} (Nr. ${esc(id)})</li>`).join("")}</ul>Bitte Rike melden, damit sie dazukommen.</div>` : ""}<ul><li>${neu} neu, ${geaendert} aktualisiert</li>${Object.entries(proJahr).sort().map(([k, v]) => `<li>${esc(sjText(k.split(" ")[0]))} ${esc(k.split(" ")[1])}: ${v}</li>`).join("")}</ul>`;
  await allesLaden();
  const abw = R.praktika.filter((x) => x.toolAbweichung || x.toolFehlt);
  const abwText = abw.length ? `<div class="karte" style="border-color:var(--achtung)"><b class="rot">⚠ ${abw.length} Mal stimmen App und Praktikumstool nicht überein</b> – steht bei der Person unter «Meine Termine»:<ul>${abw.map((x) => `<li>${esc(x.person.name)} (${esc(x.wer)}): hier ${esc(kurzDatum(x.termin.datum) + " " + (x.termin.zeit || ""))}, im Tool ${x.toolAbweichung ? esc(kurzDatum(x.toolAbweichung.datum) + " " + (x.toolAbweichung.zeit || "")) : "kein Besuch eingetragen"}</li>`).join("")}</ul></div>` : "";
  if ($("#ergTool")) $("#ergTool").innerHTML = abwText + text;
  meldung(`Praktika eingelesen: ${neu} neu, ${geaendert} aktualisiert.`);
  return { neu, geaendert };
}

/* Alte Excel-Liste «Buchhaltung Praxisbesuche»: Freitexte in feste Werte */
function altImportieren(zeilen) {
  const T = (v) => (v == null ? "" : v instanceof Date ? v : String(v).replace(/\s+/g, " ").trim());
  const sj = (jan) => (jan ? `${String((jan - 1) % 100).padStart(2, "0")}-${String(jan % 100).padStart(2, "0")}` : "");
  const jahrAus = (t) => { const m = String(t).match(/(?<!\d)(20\d\d|\d\d)(?!\d)/); if (!m) return 0; const j = Number(m[1]); return j > 100 ? j : 2000 + j; };
  const bekannt = new Set([...KUERZEL_STANDARD, ...KUERZEL_ALT, ...S.einst.dozierende.map((d) => d.kuerzel)]);
  const kuerzel = (t) => { const w = (String(t).match(/\b[a-z]{2,3}\b/g) || []).find((x) => bekannt.has(x) || TIPPFEHLER[x]); return w ? TIPPFEHLER[w] || w : ""; };
  const besuch = (t, jahrSpalte) => {
    const r = { text: t, sj: "", wer: "", status: "", art: "" };
    let jahr = jahrSpalte ? jahrAus(jahrSpalte) : 0;
    if (!t) { r.sj = sj(jahr); return r; }
    const tl = t.toLowerCase(), w = tl.match(/^w(\d\d)/);
    if (w) { r.sj = sj(2000 + Number(w[1])); r.status = "offen"; return r; }
    if (tl.includes("nicht besuchen")) { r.sj = sj(jahr); r.status = "nicht nötig"; return r; }
    if (tl.includes("nochmals besuchen")) { r.sj = sj(jahr); r.status = "offen"; r.erneut = true; return r; }
    if (tl.includes("abgebrochen")) { r.sj = sj(jahrAus(t) || jahr); r.status = "abgebrochen"; return r; }
    const k = kuerzel(t);
    if (k) { const j = jahrAus(t) || jahr; r.sj = sj(j); r.wer = k; r.status = j > 2026 ? "übernommen" : "besucht"; r.art = tl.includes("(w)") || tl.includes("wertsch") ? "Wertschätzung" : "regulär"; }
    else r.sj = sj(jahr);
    return r;
  };
