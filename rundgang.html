    vorher: () => { const n = document.querySelector("#app table.liste tbody tr .name"); if (n) n.click(); }, nachher: () => detailZu() },
  { ziel: "#frageFeld .leg-zeile", ansicht: "planung", titel: "Termine ▸ = buchen", text: "<ul><li><b>Termine ▸</b> zeigt Woche für Woche alle möglichen Termine. Flach = Einzel-, hoch = Doppellektion, grün = danach frei zum Besprechen.</li><li><b>Schon weggefiltert</b>: Arbeitssitzungen, die ersten Tage des Praktikums, der letzte Tag und weitere Regeln – und Lektionen, in denen beim Holen der Daten schon jemand eingetragen war (z.B. Mentor/in).</li><li><b>Termin anklicken = buchen.</b></li></ul>",
    vorher: () => { const b = [...document.querySelectorAll("#app table.liste button")].find((x) => x.textContent.trim().startsWith("Termine")); if (b) b.click(); }, nachher: () => { const d = $("#frage"); if (d.open) d.close(); } },
  { ansicht: "planung", titel: "Wichtig: im Praktikumstool eintragen", text: "<ul><li>Nach dem Klick öffnet sich rechts <b>das Praktikumstool bei dieser Person</b>.</li><li>Dort den Besuch <b>auch eintragen</b> – andere Fächer und Mentor/innen buchen dort ebenfalls.</li><li>Kurz prüfen, ob die Lektion inzwischen besetzt ist. Wenn ja: hier <b>Termin wieder abgeben</b> und einen anderen wählen. Sonst eintragen, Fenster schliessen, fertig.</li></ul>" },
  // --- Halbtag
  { ziel: () => ECHT ? paarZeilen()[0] || null : zeileMit("Halb Hanna"), ansicht: "halbtag", titel: "Halbtag: Doppelbesuche", text: "<ul><li>Gleiche Periode, gleiches Schulhaus, gleiche Praxislehrperson → die beiden stehen als <b>Paar</b> in einer Zeile.</li><li>Ein Klick auf einen Termin bucht <b>beide zusammen</b>.</li><li>Danach öffnet sich das Tool nicht sofort: Du bekommst <b>für jede Person einen Knopf</b> und trägst den Besuch nacheinander bei beiden ein.</li></ul>", vorher: () => geheZu("halbtag") },
  { ziel: () => ($("#frage").open ? $("#frageFeld") : null), ansicht: "halbtag", titel: "Stundenpläne verschieden eingetragen",
    text: () => "<ul>" + (!ECHT ? "<li>Hier haben Ida und Jan ihren Stundenplan verschieden eingetragen (einmal Doppellektion, einmal zwei Einzellektionen).</li>"
      : $("#frage").open ? "<li>Bei diesem Paar sind die Stundenpläne verschieden eingetragen.</li>" : "<li>Im Moment gibt es in der Liste kein solches Paar.</li>")
      + "<li>Haben die beiden ihren Stundenplan verschieden eingetragen (andere Zeiten, einmal Doppel-, einmal Einzellektionen), stehen <b>beide Pläne nebeneinander</b>.</li><li>Zuerst links für Person A den Termin wählen, dann rechts für Person B. Jede Person wird einzeln gebucht.</li></ul>",
    vorher: () => verschiedenesPaarOeffnen(), nachher: () => { const d = $("#frage"); if (d.open) d.close(); } },
  { ziel: () => aufraeumKnoepfe(), ansicht: "halbtag", titel: "Halbtag: aufräumen", text: "<ul><li><b>✕</b> neben dem Namen: Wer nicht in die Liste gehört (z.B. kein eigener Mathe-Unterricht), lässt sich entfernen – mit Sicherheitshaken. Unten bei «Entfernt» lässt er sich wieder aufnehmen.</li><li><b>⇄ Doppelbesuch</b> (bei Einzelnen): zwei sind in derselben Klasse, wurden aber nicht erkannt → von Hand zusammenlegen.</li><li><b>trennen</b> (bei Paaren): fälschlich als Paar erkannt → in zwei Einzelbesuche trennen.</li></ul>", vorher: () => geheZu("halbtag") },
  // --- Meine Termine
  { ziel: "#app .filter", ansicht: "termine", titel: "Meine Termine", text: "<ul><li>Alle deine Besuche nach Tag; filtern nach Halbtag, Einzel, Profil, Quartal.</li><li><b>Liste für Excel kopieren</b>: die Liste in Excel oder eine Mail einfügen.</li><li><b>📅 Alle Termine für Outlook</b>: alle kommenden Besuche als Kalenderdatei. Einzeln geht es mit 📅 in der Zeile.</li></ul>", vorher: () => geheZu("termine") },
  { ziel: () => document.querySelector("#app table.liste tbody tr td:last-child"), ansicht: "termine", titel: "Nach dem Besuch", text: "<ul><li><b>✓ Erledigt</b> nach dem Besuch anklicken.</li><li>Vorher: <b>Anpassen ▾</b> – Termin ändern (z.B. Sporttag) oder wieder abgeben; danach öffnet sich das Praktikumstool zum Nachführen.</li><li><b>Achtung / Bemerkung</b>: z.B. «im Quartal nochmals besuchen» – dann ist der Folgebesuch dort Pflicht.</li><li><b>Kontakte</b> unter dem Namen: Praxislehrperson und Mentor/in mit E-Mail.</li></ul>" },
  { ziel: () => [...document.querySelectorAll("#app table.liste button")].find((x) => x.textContent.includes("Bericht")), ansicht: "termine", titel: "Berichte hochladen", text: "<ul><li><b>Bericht ↑</b>: Der Bericht landet im Ordner der Person unter «Protokolle»; danach öffnet sich eine E-Mail an Studierende, PxL und Mentor/in.</li><li><b>Die ganze Berichtsbuchhaltung läuft jetzt hier.</b> Im alten Ordner «Protokolle UB» nicht mehr arbeiten – alle Berichte liegen als Kopie hier.</li><li>Gibt es für eine Person noch keinen Ordner, wird er beim Hochladen <b>automatisch angelegt</b>.</li></ul>" },
  // --- Studierende, Aktualisieren
  { ziel: "#app table.liste thead", ansicht: "studierende", titel: "Studierende", text: "<ul><li>Übersicht über alle: je Person Halbtag, Profil, Quartal mit Jahr · Stand · von, 📄 = Bericht.</li><li><b>Klick auf ein Praktikum</b>: Stand korrigieren (z.B. Abbruch). Klick auf Studiengang/Fächer: ändern.</li><li>Die Suche findet auch Personen im Archiv; «zurückholen» holt sie wieder zu den aktuellen.</li><li>Klick auf den Namen: derselbe Verlauf wie beim Planen.</li></ul>", vorher: () => geheZu("studierende") },
  { ziel: "nav button[data-ansicht=aktualisieren]", ansicht: "start", titel: "Aktualisieren", text: "<ul><li>Betrifft euch beim Buchen in der Regel <b>nicht</b>.</li><li>Das wird ein- bis mehrmals im Semester gepflegt, damit die aktuellsten Termine aus dem offiziellen Praktikumstool in der Seite sind.</li></ul>", vorher: () => geheZu("start") },
  { ziel: "nav button[data-ansicht=hilfe]", ansicht: "start", titel: "Fertig", text: () => "<ul><li>In der <b>Hilfe</b> steht alles nochmals zum Nachlesen; dort startet auch dieser Rundgang.</li></ul>" + (ECHT ? "" : "<p><b>Jetzt oben «Zur echten Seite»</b> – dort einmal den Ordner wählen.</p>"), ende: true },
];
/* Halbtag-Liste: Zeilen mit einem Paar */
function paarZeilen() { return [...document.querySelectorAll("#app table.liste tbody tr")].filter((r) => /Paar/.test(r.textContent)); }
/* ein Paar mit verschieden eingetragenen Plänen suchen und dessen Terminfenster (nebeneinander) öffnen */
function verschiedenesPaarOeffnen() {
  const d = $("#frage");
  const zeilen = ECHT ? paarZeilen() : [zeileMit("Jost Jan")].filter(Boolean);
  for (const z of zeilen) {
    const b = [...z.querySelectorAll("button")].find((x) => x.textContent.trim().startsWith("Termine")); if (!b) continue;
    b.click();
    if (d.open && d.classList.contains("breit")) return true;
    if (d.open) d.close();
  }
  return false;
}
/* die Knöpfe zum Aufräumen: das erste ✕, das erste «⇄ Doppelbesuch», das erste «trennen» */
function aufraeumKnoepfe() {
  const k = [...document.querySelectorAll("#app table.liste tbody button")];
  return [k.find((b) => b.textContent.trim() === "✕"), k.find((b) => b.textContent.includes("Doppelbesuch")), k.find((b) => b.textContent.trim() === "trennen")].filter(Boolean);
}
/* Zeile der Liste, in der ein Name vorkommt */
function zeileMit(name) { return [...document.querySelectorAll("#app table.liste tbody tr")].find((r) => r.textContent.includes(name)) || null; }
/* Teile des Rundgangs: Name und erster Schritt (Index); ein Teil reicht bis vor den nächsten */
const TEILE = [["Startseite", 0], ["Planen und Buchen", 6], ["Halbtag", 11], ["Meine Termine und Berichte", 14], ["Studierende und Abschluss", 17]];
function teilVon(i) { let t = 0; TEILE.forEach(([, ab], n) => { if (i >= ab) t = n; }); const von = TEILE[t][1], bis = t + 1 < TEILE.length ? TEILE[t + 1][1] : SCHRITTE.length; return { t, name: TEILE[t][0], von, bis }; }
let schritt = 0, uhr = null;
function rundgangStart() {
  const t = document.createElement("div"); t.id = "tour"; document.body.appendChild(t);
  zeige(0);
}
function zeige(i) {
  if (!ECHT && !S.ich) { S.ich = "clu"; merke("ich", "clu"); }   // Beispiel: auch beim Springen zu einem Schritt
  const alt = SCHRITTE[schritt]; if (alt && alt.nachher && i !== schritt) alt.nachher();
  document.querySelectorAll(".tour-licht").forEach((e) => e.classList.remove("tour-licht"));
  schritt = Math.max(0, Math.min(SCHRITTE.length - 1, i));
  const s = SCHRITTE[schritt];
  if (s.ansicht && S.ansicht !== s.ansicht) geheZu(s.ansicht);
  if (s.ansicht === "planung" && lies("raster") === "zu") { merke("raster", "auf"); zeichnen(); }
  if (s.vorher) s.vorher();
  const sText = typeof s.text === "function" ? s.text() : s.text;
  setTimeout(() => {
    const t = document.getElementById("tour");
    // Ist die grosse Ansicht (Dialog) offen, muss das Tour-Fenster darin liegen, sonst ist es nicht anklickbar
    const dlg = $("#frage");
    if (dlg.open && t.parentElement !== dlg) dlg.appendChild(t);
    if (!dlg.open && t.parentElement !== document.body) document.body.appendChild(t);
    let ziel = typeof s.ziel === "function" ? s.ziel() : s.ziel ? document.querySelector(s.ziel) : null;
    const ziele = Array.isArray(ziel) ? ziel : ziel ? [ziel] : []; ziel = ziele[0] || null;
    const tl = teilVon(schritt);
    const balken = TEILE.map(([name, ab], n) => { const bis = n + 1 < TEILE.length ? TEILE[n + 1][1] : SCHRITTE.length, anteil = n < tl.t ? 1 : n > tl.t ? 0 : (schritt - ab + 1) / (bis - ab);
      return `<span title="Teil ${n + 1}: ${name}" style="flex:${bis - ab}"><i style="width:${Math.round(anteil * 100)}%"></i></span>`; }).join("");
    t.innerHTML = `<div class="t-kopf griff" title="Ziehen zum Verschieben"><div class="t-zeile"><span>Teil ${tl.t + 1} von ${TEILE.length} · <b style="color:#fff">${tl.name}</b> · Schritt ${schritt - tl.von + 1} von ${tl.bis - tl.von}</span>
        <button class="t-zu" title="Rundgang beenden (Esc)" onclick="rundgangEnde()">✕ Beenden</button></div>
      <h4>${s.titel}</h4><div class="t-balken">${balken}</div></div>
      <div class="t-inhalt">${sText}</div>
      <div class="tk"><select onchange="zeige(Number(this.value))" title="Direkt zu einem Teil oder Schritt">${TEILE.map(([name, ab], n) => { const bis = n + 1 < TEILE.length ? TEILE[n + 1][1] : SCHRITTE.length;
        return `<optgroup label="${n + 1}. ${name}">${SCHRITTE.slice(ab, bis).map((x, k) => `<option value="${ab + k}" ${ab + k === schritt ? "selected" : ""}>${x.titel}</option>`).join("")}</optgroup>`; }).join("")}</select>
      <span style="display:flex;gap:8px">${schritt ? '<button class="knopf" onclick="weiter(-1)">‹ Zurück</button>' : ""}
      ${s.ende ? (ECHT ? '<button class="knopf haupt" onclick="rundgangEnde()">Schliessen</button>' : '<a href="./" class="knopf haupt" style="text-decoration:none">Zur echten Seite ›</a>')
               : '<button class="knopf haupt" onclick="weiter(1)">Weiter ›</button>'}</span></div>`;
    if (ziel) {
      ziele.forEach((z) => z.classList.add("tour-licht")); ziel.scrollIntoView({ block: "center" });
      // Platz: unter dem Ziel, sonst darüber, sonst unten rechts in der Ecke (verdeckt das Ziel möglichst nicht)
      const r = ziel.getBoundingClientRect(), h = t.offsetHeight, b = t.offsetWidth;
      let top, left = Math.min(innerWidth - b - 10, Math.max(10, r.left));
      if (r.bottom + 14 + h < innerHeight) top = r.bottom + 14;
      else if (r.top - 14 - h > 0) top = r.top - 14 - h;
      else { top = innerHeight - h - 16; left = innerWidth - b - 16; }
      t.style.top = Math.max(10, top) + "px"; t.style.left = left + "px";
    } else { t.style.top = "30%"; t.style.left = "calc(50% - 190px)"; }
    clearTimeout(uhr);
  }, 350);
}
function weiter(d) { zeige(schritt + d); }
/* Kästchen mit der Maus verschieben (falls es etwas verdeckt) */
document.addEventListener("mousedown", (e) => {
  const g = e.target.closest && e.target.closest("#tour .griff"); if (!g || e.target.closest("button")) return;
  const t = document.getElementById("tour"), r = t.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
  t.style.transition = "none";
  const zieh = (m) => { t.style.left = Math.max(0, m.clientX - dx) + "px"; t.style.top = Math.max(0, m.clientY - dy) + "px"; };
  const los = () => { document.removeEventListener("mousemove", zieh); document.removeEventListener("mouseup", los); t.style.transition = ""; };
  document.addEventListener("mousemove", zieh); document.addEventListener("mouseup", los); e.preventDefault();
});
function rundgangEnde() {
  const s = SCHRITTE[schritt]; if (s && s.nachher) s.nachher();
  document.querySelectorAll(".tour-licht").forEach((e) => e.classList.remove("tour-licht"));
  const t = document.getElementById("tour"); if (t) t.remove();
  if (ECHT) return;
  const k = document.createElement("button"); k.className = "knopf haupt"; k.textContent = "▶ Rundgang neu starten";
  k.style.cssText = "position:fixed;right:16px;bottom:16px;z-index:50"; k.onclick = () => { k.remove(); rundgangStart(); };
  document.body.appendChild(k);
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.getElementById("tour")) rundgangEnde(); });
</script>
